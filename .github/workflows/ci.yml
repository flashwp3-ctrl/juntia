name: Frontend foundation
# ADR-011 §5, enmienda del 4 de noviembre de 2026: un solo job en serie, sin PR de solo
# documentación ni borradores, y cancelación del run anterior del mismo PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Solo tipos de archivo documentales, nunca carpetas enteras (ADR-011 §5). El orden importa:
    # lo que alimenta herramientas o agentes se vuelve a incluir, aunque sea Markdown.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**/*.png"
      - "!specs/**/*.png"
      - "!specs/**/*.txt"
      - ".specify/**"
      - ".claude/**"
      - ".agents/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      # Explícitos por si "**" no cubre carpetas con punto.
      - ".github/**"
      - ".githooks/**"
  workflow_dispatch:
    inputs:
      measure_workers:
        description: "T054: run spec E2E 1 with 1, 2 and 4 workers"
        type: boolean
        default: false
      capture_evidence:
        description: "T053/T057: screenshots, seven-width pass and theme harness (PR evidence, not a gate)"
        type: boolean
        default: false
      evidence_filter:
        description: "PR D: only capture registry states whose route or state matches this regular expression (empty = all)"
        type: string
        default: ""
      a11y_sweep:
        description: "Decision 21.2: full accessibility sweep (seven widths, 200 % text, keyboard, 44 px; tests tagged @sweep). Manual, launched by the manager"
        type: boolean
        default: false
      release_lab:
        description: "005 (contracts/ci.md): the release lab job (CLS, frame comparator, INP, LCP, GoalStack, long lists, WebKit E2E). Exclusive: not combined with any other input. Not a gate"
        type: boolean
        default: false
      release_legs:
        description: "005: with release_lab, only these legs (names or prefixes, comma separated, e.g. cls-metas,webkit-cls; empty = all 17)"
        type: string
        default: ""
# Maestro §15.10, decisión 21: en cada PR, el nivel ligero de accesibilidad (cada estado una vez, a 390, en los dos temas);
# con «Run workflow» y a11y_sweep, solo el barrido completo (@sweep; playwright.config.ts), en los jobs app y a11y-session.
# Sin el input (pull_request), vacío.
env:
  A11Y_LEVEL: ${{ inputs.a11y_sweep && 'sweep' || '' }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inputs-guard:
    # 005 (contracts/ci.md, «Entradas a mano»; F85-4, F85-9). `release_lab` es exclusiva: con cualquier otra entrada, este job
    # falla con ::error y nada más corre. Corre también en cada pull_request no borrador, donde termina bien sin validar: todos
    # los demás jobs dependen de él (needs) con el success() implícito de su `if`, así que, si se omitiera en un PR, GitHub
    # omitiría también el gate y un check omitido podría contar como satisfecho. tests/ci-workflow.test.ts lo simula.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject release_lab combined with other inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          INVALID: ${{ inputs.release_lab && (inputs.capture_evidence || inputs.a11y_sweep || inputs.measure_workers) }}
        run: |
          if [ "$INVALID" = "true" ]; then echo "::error title=Entradas::release_lab no se combina con otras entradas (capture_evidence, a11y_sweep, measure_workers)"; exit 1; fi
          echo "Entradas válidas"
      # F87-3 (revisión del PR #87): con release_lab, la selección de release_legs se valida entera antes de la matriz. Un
      # elemento vacío o un nombre que no coincide con ningún tramo deja el run en rojo, en vez de 25 tramos «no pedido».
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch' && inputs.release_lab
        with:
          sparse-checkout: scripts/release-leg.mjs
          sparse-checkout-cone-mode: false
      - name: Validate release_legs
        if: github.event_name == 'workflow_dispatch' && inputs.release_lab
        env:
          RELEASE_LEGS: ${{ inputs.release_legs }}
        run: node scripts/release-leg.mjs validate

  app:
    # Un borrador no corre (se lanza a mano con «Run workflow»); un lanzamiento manual sí.
    # Un lanzamiento manual solo de evidencia (capture_evidence) o del laboratorio (release_lab) no repite el gate.
    needs: inputs-guard
    if: (github.event_name == 'workflow_dispatch' && !inputs.capture_evidence && !inputs.release_lab) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start job clock
        run: echo "JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install, lint, typecheck and unit and component tests
        # Decisión 21.2: el barrido a mano (a11y_sweep) solo instala; lo demás ya pasó en el PR. Los estados sin sesión del
        # barrido necesitan el build de este job (Supabase inalcanzable a propósito), así que el barrido no sale de aquí.
        run: node scripts/ci.mjs run ${{ inputs.a11y_sweep && 'ci' || 'ci lint typecheck test:unit test:components' }}
      - name: Restore the Next build cache
        # Solo .next/cache, lo que Next documenta como seguro entre builds (guía «CI Build Caching»; desde 16.3 guarda ahí
        # también la caché de Turbopack de `next build`). Clave por job, lockfile y src/; restore-keys reusa la última
        # build del job aunque cambie src/ (docs/TESTING.md §9).
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: next-${{ runner.os }}-app-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-app-${{ hashFiles('package-lock.json') }}-
      - name: Build once with the unreachable Supabase URL
        # T051/T052 (002, PR B): axe solo de los estados sin sesión. Este job no tiene Supabase: la URL apunta a un puerto
        # local donde no escucha nadie, así que el acceso responde con el error de red real (A1d). No es una clave.
        env:
          A11Y_JOB: app
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_unreachable-in-app-job
        run: node scripts/ci.mjs run build
      - name: Install Chromium (own time limit, one retry)
        # PR C de la 002: `playwright install --with-deps` se colgó dos veces en el PR B y otra en el PR C (run 42138118052).
        # La salida a la vista (run 42153365570) mostró la causa: no es un cuelgue, es apt bajando las fuentes de
        # `install-deps` a ~40 KB/s desde el mirror del runner; las librerías de Chromium ya vienen en la imagen. Por eso:
        # descarga del navegador con 150 s y un reintento; si Chromium arranca con las librerías del runner, no se instala
        # nada con apt; si no arranca, `install-deps` con 150 s y un reintento, matando antes el apt-get que dejó el
        # intento anterior (el `timeout` mata npx, no a su apt-get con sudo, que retiene el bloqueo de dpkg). Sin caché de
        # binarios (docs/TESTING.md §9).
        timeout-minutes: 6
        shell: bash
        run: |
          started=$(date +%s%3N)
          try() { for attempt in 1 2; do timeout 150 "$@" && return 0; echo "::warning::$* (intento $attempt) falló o superó 150 s"; sudo pkill -x apt-get || true; done; return 1; }
          try npx playwright install --only-shell chromium
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close(), () => process.exit(1))"; then
            echo "Chromium arranca con las librerías del runner: sin install-deps"
          else
            try npx playwright install-deps chromium
          fi
          echo "{\"command\":\"chromium\",\"seconds\":$(( ($(date +%s%3N) - started) / 1000 )),\"status\":0}" >> "$RUNNER_TEMP/juntia-ci-$GITHUB_JOB.jsonl"
      - name: Chromium, axe, internal surface and theme script on that build
        env:
          A11Y_JOB: app
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_unreachable-in-app-job
        run: node scripts/ci.mjs run ${{ inputs.a11y_sweep && 'test:a11y' || 'test:a11y check:internal-surface check:theme-script' }}
      - name: Publish timings and non-applicable controls
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ci.mjs summary

  db:
    # Un lanzamiento manual solo de evidencia (capture_evidence) no repite el gate; el barrido de accesibilidad (a11y_sweep)
    # tampoco necesita las pruebas SQL.
    needs: inputs-guard
    if: (github.event_name == 'workflow_dispatch' && !inputs.capture_evidence && !inputs.a11y_sweep && !inputs.release_lab) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # PostgreSQL plano del ensayo de restauración. Run 43061973171 (11-nov-2026): el puerto anterior, 55432, cae en el
      # rango efímero de Linux (32768–60999) y un puerto aleatorio de Docker o Supabase lo había tomado («Address already
      # in use»). 15432 queda por debajo de ese rango y fuera de los puertos de supabase/config.toml (54320–54329, 8083).
      PLAIN_PG_PORT: 15432
    steps:
      - name: Start job clock
        run: echo "JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          # F40-3: N6 usa el commit real de foundation, no un SHA inexistente.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Start Supabase and reset the runner database
        id: database
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1 || { echo "Supabase start failed (raw log withheld because it may contain credentials)"; exit 1; }
          seconds=$(($(date +%s)-started))
          echo "supabase start: ${seconds} s" | tee -a "$GITHUB_STEP_SUMMARY"
          # El comando imprime credenciales: capturar y enmascarar antes de cualquier salida.
          status=$(supabase status -o env 2>/dev/null)
          while IFS='=' read -r name value; do
            value=${value#\"}; value=${value%\"}
            [ -z "$value" ] || echo "::add-mask::$value"
            case "$name" in
              API_URL|PUBLISHABLE_KEY|SECRET_KEY|DB_URL) printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV" ;;
            esac
          done <<< "$status"
          supabase db reset
      - name: Install dependencies
        id: install
        run: node scripts/ci.mjs run ci
      - name: Test SQL
        run: node scripts/ci.mjs run test:db
      - name: Test API
        if: always() && steps.database.outcome == 'success' && steps.install.outcome == 'success'
        run: node scripts/ci.mjs run test:integration
      - name: Check generated types
        if: always() && steps.database.outcome == 'success' && steps.install.outcome == 'success'
        run: node scripts/ci.mjs run db:types:check
      - name: Preserve generated public types
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: database-types
          path: ${{ runner.temp }}/database.types.ts
          if-no-files-found: ignore
      - name: Describe Auth bootstrap for the plain PostgreSQL restore
        if: always() && steps.database.outcome == 'success'
        shell: bash
        run: |
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select jsonb_build_object('uid', pg_get_functiondef('auth.uid()'::regprocedure), 'columns', (select jsonb_agg(jsonb_build_object('table',c.relname,'name',a.attname,'type',format_type(a.atttypid,a.atttypmod),'notnull',a.attnotnull,'generated',a.attgenerated,'default',pg_get_expr(d.adbin,d.adrelid)) order by c.relname,a.attnum) from pg_attribute a join pg_class c on c.oid=a.attrelid join pg_namespace n on n.oid=c.relnamespace left join pg_attrdef d on d.adrelid=a.attrelid and d.adnum=a.attnum where n.nspname='auth' and c.relname in ('users','identities') and a.attnum>0 and not a.attisdropped));" > "$RUNNER_TEMP/auth-bootstrap.json"
          # F40-2: solo firmas y ACL, nunca cuerpos, claves ni filas de usuario.
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select n.nspname,p.oid::regprocedure,coalesce(p.proacl::text,'DEFAULT') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where p.proowner='postgres'::regrole and n.nspname !~ '^pg_' and n.nspname<>'information_schema' and (has_function_privilege('anon',p.oid,'EXECUTE') or has_function_privilege('authenticated',p.oid,'EXECUTE')) order by n.nspname,p.proname,p.oid;" > "$RUNNER_TEMP/postgres-execute-inventory.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: auth-bootstrap-description
          path: |
            ${{ runner.temp }}/auth-bootstrap.json
            ${{ runner.temp }}/postgres-execute-inventory.txt
          if-no-files-found: ignore
      - name: Install plain PostgreSQL 17 from PGDG
        id: plain
        shell: bash
        # Runs 43045655895 y 43052000905 (11-nov-2026): `apt-get update` completo se colgó reintentando
        # azure.archive.ubuntu.com («Temporary failure resolving») hasta agotar el job, aunque PGDG respondía en menos de
        # un segundo. La imagen ya trae postgresql-common (PGDG) con su llave y todas las dependencias de PostgreSQL 17
        # (run 42965711679: solo se instalaron postgresql-17 y postgresql-client-17, ambos de PGDG), así que apt mira
        # solo la lista de PGDG, sin espejos de Ubuntu, con tiempos acotados. Si PGDG falla, el paso falla rápido y claro.
        # Reparto del tope: update 90 s + install 150 s + clúster hasta 60 s (pg_createcluster y pg_isready) = 300 s; los
        # 6 min dejan margen para que salga nuestro ::error antes de que GitHub cancele el paso.
        timeout-minutes: 6
        run: |
          set -euo pipefail
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          [ -s "$key" ] || { echo "::error title=PGDG::Falta la llave $key en la imagen; no se instala PostgreSQL 17."; exit 1; }
          list="$RUNNER_TEMP/pgdg.list"
          echo "deb [signed-by=$key] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" > "$list"
          pgdg=(-o "Dir::Etc::sourcelist=$list" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
            -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo timeout 90 apt-get "${pgdg[@]}" update -q --error-on=any \
            || { echo "::error title=PGDG::apt.postgresql.org no respondió (apt-get update, máx. 90 s); el ensayo de restauración no corre. Reintentar el job."; exit 1; }
          sudo timeout 150 apt-get "${pgdg[@]}" install -y -q --no-install-recommends postgresql-17 postgresql-client-17 \
            || { echo "::error title=PGDG::No se instaló PostgreSQL 17 solo desde PGDG (descarga o dependencia ausente en la imagen; máx. 150 s)."; exit 1; }
          # Antes de crear el clúster: si alguien ya escucha en el puerto, se dice quién y se falla con un error claro.
          if sudo ss -Hltn "sport = :$PLAIN_PG_PORT" | grep -q .; then
            echo "::error title=PostgreSQL plano::El puerto $PLAIN_PG_PORT ya está en uso en el runner; el clúster del ensayo de restauración no puede escuchar ahí."
            sudo ss -Hltnp "sport = :$PLAIN_PG_PORT" || true
            exit 1
          fi
          sudo pg_createcluster 17 juntia --port "$PLAIN_PG_PORT" --start
          # PR #52: el cluster rechazó conexiones unos 25 s después de crearlo. Se espera a que acepte (hasta 60 s) y, si
          # no, se imprime su log antes de fallar.
          for attempt in $(seq 1 60); do pg_isready -h 127.0.0.1 -p "$PLAIN_PG_PORT" -q && break; sleep 1; done
          pg_isready -h 127.0.0.1 -p "$PLAIN_PG_PORT" || { sudo cat /var/log/postgresql/postgresql-17-juntia.log; exit 1; }
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          sudo -u postgres psql -p "$PLAIN_PG_PORT" -q -v ON_ERROR_STOP=1 -c "alter user postgres password '$password'"
          connection="postgresql://postgres:$password@127.0.0.1:$PLAIN_PG_PORT"
          echo "::add-mask::$connection"
          echo "PG=$connection" >> "$GITHUB_ENV"
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Restore drill and nine negative controls
        shell: bash
        run: |
          for attempt in $(seq 1 60); do pg_isready -h 127.0.0.1 -p "$PLAIN_PG_PORT" -q && break; sleep 1; done
          pg_isready -h 127.0.0.1 -p "$PLAIN_PG_PORT" || { sudo cat /var/log/postgresql/postgresql-17-juntia.log; exit 1; }
          node scripts/ci.mjs run db:restore-drill
      - name: Plain PostgreSQL log on failure
        if: failure() && steps.plain.outcome == 'success'
        run: sudo cat /var/log/postgresql/postgresql-17-juntia.log
      - name: Stop plain PostgreSQL
        if: always() && steps.plain.outcome == 'success'
        run: sudo pg_dropcluster --stop 17 juntia
      - name: Stop Supabase
        if: always()
        run: supabase stop
      - name: Publish db timings
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ci.mjs summary

  e2e:
    # T052 (002, PR B) / FR-065–FR-067; contracts/ci.md: Supabase del runner con Auth y Mailpit, build con sus variables y
    # las specs E2E que elige el selector por área (`test:e2e:smoke`), incluidas las @mail. Decisión de los fundadores del
    # 17 nov 2026: el axe con sesión sale de este job al job `a11y-session`, que corre en paralelo con su propio Supabase y
    # su propio build (gate del PR #82: 609 s de 660 s, y P0-4 añade pruebas).
    # Un lanzamiento manual solo de evidencia (capture_evidence) no repite el gate; el barrido de accesibilidad a mano
    # (a11y_sweep) corre solo en `a11y-session` (decisión 21.2), así que con él este job no arranca, SALVO que también se pida
    # la medición T054 (measure_workers): revisión del PR #83, F83-1. Entonces arranca, el selector y el smoke se saltan
    # (guardias por paso) y solo mide, como antes de la partición.
    needs: inputs-guard
    if: (github.event_name == 'workflow_dispatch' && !inputs.capture_evidence && !inputs.release_lab && (!inputs.a11y_sweep || inputs.measure_workers)) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    # Decisión de los fundadores del 10 nov 2026: 12 min, para que el presupuesto de 660 s (scripts/ci.mjs) avise antes de que
    # GitHub cancele el job (antes, 10 min sobre un presupuesto de 480 s). Desde el 17 nov 2026, cada uno de los dos jobs
    # con Supabase (`e2e` y `a11y-session`) conserva el mismo presupuesto y el mismo tope.
    timeout-minutes: 12
    env:
      SITE_URL: http://localhost:3400
    steps:
      - name: Start job clock
        run: echo "JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          # 004 PR B (T035): la historia que el selector necesita para git diff <base>...HEAD; sin ella, todas las specs (regla 6).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Start Supabase with Auth and Mailpit
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1 || { echo "Supabase start failed (raw log withheld because it may contain credentials)"; exit 1; }
          seconds=$(($(date +%s)-started))
          echo "supabase start: ${seconds} s" | tee -a "$GITHUB_STEP_SUMMARY"
          # El comando imprime credenciales: capturar y enmascarar antes de cualquier salida.
          status=$(supabase status -o env 2>/dev/null)
          while IFS='=' read -r name value; do
            value=${value#\"}; value=${value%\"}
            [ -z "$value" ] || echo "::add-mask::$value"
            case "$name" in
              API_URL|PUBLISHABLE_KEY|SECRET_KEY|DB_URL) printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV" ;;
            esac
            case "$name" in
              API_URL) printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$value" >> "$GITHUB_ENV" ;;
              PUBLISHABLE_KEY) printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$value" >> "$GITHUB_ENV" ;;
            esac
          done <<< "$status"
      - name: Restore the Next build cache
        # Igual que en el job app, con su propia clave: este job compila con las variables públicas del Supabase del runner.
        # `a11y-session` compila con las mismas variables y usa la MISMA clave a propósito (17 nov 2026): cada job restaura la
        # caché del otro; el que termina segundo no la vuelve a guardar (la entrada ya existe: aviso, no fallo).
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: next-${{ runner.os }}-e2e-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-e2e-${{ hashFiles('package-lock.json') }}-
      - name: Install and build with the runner's Supabase
        run: node scripts/ci.mjs run ci build
      - name: Install Chromium (own time limit, one retry)
        # PR C de la 002: `playwright install --with-deps` se colgó dos veces en el PR B y otra en el PR C (run 42138118052).
        # La salida a la vista (run 42153365570) mostró la causa: no es un cuelgue, es apt bajando las fuentes de
        # `install-deps` a ~40 KB/s desde el mirror del runner; las librerías de Chromium ya vienen en la imagen. Por eso:
        # descarga del navegador con 150 s y un reintento; si Chromium arranca con las librerías del runner, no se instala
        # nada con apt; si no arranca, `install-deps` con 150 s y un reintento, matando antes el apt-get que dejó el
        # intento anterior (el `timeout` mata npx, no a su apt-get con sudo, que retiene el bloqueo de dpkg). Sin caché de
        # binarios (docs/TESTING.md §9).
        timeout-minutes: 6
        shell: bash
        run: |
          started=$(date +%s%3N)
          try() { for attempt in 1 2; do timeout 150 "$@" && return 0; echo "::warning::$* (intento $attempt) falló o superó 150 s"; sudo pkill -x apt-get || true; done; return 1; }
          try npx playwright install --only-shell chromium
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close(), () => process.exit(1))"; then
            echo "Chromium arranca con las librerías del runner: sin install-deps"
          else
            try npx playwright install-deps chromium
          fi
          echo "{\"command\":\"chromium\",\"seconds\":$(( ($(date +%s%3N) - started) / 1000 )),\"status\":0}" >> "$RUNNER_TEMP/juntia-ci-$GITHUB_JOB.jsonl"
      - name: Select E2E specs by area
        id: select
        # 004 PR B (T035, F64-5; specs/004-presupuestos-y-metas/contracts/ci.md): las specs 1–3 siempre y la 4 o la 5 según
        # el área del PR; lo compartido, lo desconocido o sin base (Run workflow), todas las existentes. El resumen del job
        # dice qué corrió, por qué y qué specs previstas todavía no existen.
        # F83-1: con a11y_sweep el job solo arranca para T054; ni selecciona ni corre el smoke.
        if: '!inputs.a11y_sweep'
        env:
          E2E_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/e2e-select.mjs --base "$E2E_BASE"
      - name: E2E smoke (selected specs)
        if: '!inputs.a11y_sweep'
        env:
          E2E_SPECS: ${{ steps.select.outputs.specs }}
        run: node scripts/ci.mjs run test:e2e:smoke
      - name: T054 · spec 1 with 1, 2 and 4 workers (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.measure_workers
        shell: bash
        run: |
          for workers in 1 2 4; do
            started=$(date +%s%3N)
            set +e
            npx playwright test --project e2e --workers "$workers" --retries 0 --reporter=line > "$RUNNER_TEMP/workers-$workers.log" 2>&1
            code=$?
            set -e
            seconds=$(( ($(date +%s%3N) - started) / 1000 ))
            summary=$(grep -E "^\s+[0-9]+ (passed|failed|flaky)" "$RUNNER_TEMP/workers-$workers.log" | tr '\n' ' ')
            echo "| $workers | ${seconds} s | exit $code | $summary |" | tee -a "$RUNNER_TEMP/workers.md"
          done
          { echo "| Workers | Duración | Salida | Resultado |"; echo "| --- | --- | --- | --- |"; cat "$RUNNER_TEMP/workers.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop Supabase
        if: always()
        run: supabase stop
      - name: Publish e2e timings
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ci.mjs summary

  a11y-session:
    # Decisión de los fundadores del 17 nov 2026: el control 5 (axe) de los estados que necesitan una sesión o la respuesta
    # real de Auth (ADR-011 §5, «Axe en dos jobs», punto 2) sale del job `e2e` y corre aquí, EN PARALELO, con su propio
    # Supabase y su propio build: el arranque de Supabase se paga dos veces (costo aceptado) y el build reusa la caché de
    # `.next` del job `e2e` (misma clave). Contiene el nivel ligero de cada PR (selector por área, con el control de ancho de
    # routes.a11y.ts) y, con «Run workflow» y a11y_sweep, el barrido completo (decisión 21.2). Los casos siguen eligiéndose
    # con A11Y_JOB=e2e, que nombra el modo «con Supabase en el runner» de tests/a11y, no el job de GitHub.
    # El selector corre primero, antes de Supabase: si el PR solo toca archivos neutros (skip=true), los demás pasos se
    # saltan y el job termina en segundos.
    needs: inputs-guard
    if: (github.event_name == 'workflow_dispatch' && !inputs.capture_evidence && !inputs.release_lab) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    # El mismo tope y el mismo presupuesto (660 s, scripts/ci.mjs) que el job `e2e`; el barrido a mano solo tiene el tope.
    timeout-minutes: 12
    env:
      SITE_URL: http://localhost:3400
    steps:
      - name: Start job clock
        run: echo "JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          # La historia que el selector necesita para git diff <base>...HEAD; sin ella, todos los archivos (regla 4).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Select light accessibility files by area
        id: select_a11y
        # Decisión de los fundadores del 11 nov 2026 (maestro §15.10, decisión 21; contracts/ci.md): el nivel ligero corre los
        # archivos a11y del área del PR, con el criterio de las specs E2E; lo compartido, lo desconocido o sin base, todos. El
        # barrido a mano (a11y_sweep) no selecciona: corre entero. El resumen del job dice qué archivos corrieron y por qué.
        # Solo usa módulos de Node: no necesita `npm ci`.
        if: '!inputs.a11y_sweep'
        # Si el script se cae antes de escribir su salida, `skip` queda vacío (el job sigue) y el paso de axe recibe
        # A11Y_FILES vacío y corre todos (regla 4).
        continue-on-error: true
        env:
          A11Y_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/a11y-select.mjs --base "$A11Y_BASE"
      # Desde aquí, cada paso que cuesta tiempo lleva `steps.select_a11y.outputs.skip != 'true'`: skip=true es un PR que solo
      # toca archivos neutros, y el resumen del selector lo dice.
      - uses: supabase/setup-cli@v3
        if: steps.select_a11y.outputs.skip != 'true'
        with:
          version: 2.121.0
      - name: Start Supabase with Auth and Mailpit
        if: steps.select_a11y.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1 || { echo "Supabase start failed (raw log withheld because it may contain credentials)"; exit 1; }
          seconds=$(($(date +%s)-started))
          echo "supabase start: ${seconds} s" | tee -a "$GITHUB_STEP_SUMMARY"
          # El comando imprime credenciales: capturar y enmascarar antes de cualquier salida.
          status=$(supabase status -o env 2>/dev/null)
          while IFS='=' read -r name value; do
            value=${value#\"}; value=${value%\"}
            [ -z "$value" ] || echo "::add-mask::$value"
            case "$name" in
              API_URL|PUBLISHABLE_KEY|SECRET_KEY|DB_URL) printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV" ;;
            esac
            case "$name" in
              API_URL) printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$value" >> "$GITHUB_ENV" ;;
              PUBLISHABLE_KEY) printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$value" >> "$GITHUB_ENV" ;;
            esac
          done <<< "$status"
      - name: Restore the Next build cache
        # La misma clave que el job `e2e` (mismas variables públicas del Supabase del runner): ver el comentario de allí.
        if: steps.select_a11y.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: next-${{ runner.os }}-e2e-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-e2e-${{ hashFiles('package-lock.json') }}-
      - name: Install and build with the runner's Supabase
        if: steps.select_a11y.outputs.skip != 'true'
        run: node scripts/ci.mjs run ci build
      - name: Install Chromium (own time limit, one retry)
        # El mismo paso que en los jobs app y e2e (PR C de la 002; docs/TESTING.md §9).
        if: steps.select_a11y.outputs.skip != 'true'
        timeout-minutes: 6
        shell: bash
        run: |
          started=$(date +%s%3N)
          try() { for attempt in 1 2; do timeout 150 "$@" && return 0; echo "::warning::$* (intento $attempt) falló o superó 150 s"; sudo pkill -x apt-get || true; done; return 1; }
          try npx playwright install --only-shell chromium
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close(), () => process.exit(1))"; then
            echo "Chromium arranca con las librerías del runner: sin install-deps"
          else
            try npx playwright install-deps chromium
          fi
          echo "{\"command\":\"chromium\",\"seconds\":$(( ($(date +%s%3N) - started) / 1000 )),\"status\":0}" >> "$RUNNER_TEMP/juntia-ci-$GITHUB_JOB.jsonl"
      - name: Axe of the states that need a session or the Auth API
        if: steps.select_a11y.outputs.skip != 'true'
        env:
          A11Y_JOB: e2e
          # Vacíos (barrido a mano o selector sin salida): todos los archivos y todo el registro (scripts/ci.mjs, npmArgs;
          # tests/a11y/route-registry.ts, routeAreaFilter).
          A11Y_FILES: ${{ steps.select_a11y.outputs.files }}
          A11Y_ROUTE_AREAS: ${{ steps.select_a11y.outputs.route_areas }}
        run: node scripts/ci.mjs run test:a11y
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          # Nombre propio: dos artefactos con el mismo nombre en un run chocan.
          name: playwright-a11y-session
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop Supabase
        if: always() && steps.select_a11y.outputs.skip != 'true'
        run: supabase stop
      - name: Publish a11y-session timings
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ci.mjs summary

  evidence:
    # T053, T057 (002, PR B) y T072, T073 (PR C): evidencia del PR, solo bajo demanda. No forma parte del gate.
    needs: inputs-guard
    if: github.event_name == 'workflow_dispatch' && inputs.capture_evidence && !inputs.release_lab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_URL: http://localhost:3400
    steps:
      - name: Start job clock
        run: echo "JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Start Supabase with Auth and Mailpit
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1 || { echo "Supabase start failed (raw log withheld because it may contain credentials)"; exit 1; }
          seconds=$(($(date +%s)-started))
          echo "supabase start: ${seconds} s" | tee -a "$GITHUB_STEP_SUMMARY"
          # El comando imprime credenciales: capturar y enmascarar antes de cualquier salida.
          status=$(supabase status -o env 2>/dev/null)
          while IFS='=' read -r name value; do
            value=${value#\"}; value=${value%\"}
            [ -z "$value" ] || echo "::add-mask::$value"
            case "$name" in
              API_URL|PUBLISHABLE_KEY|SECRET_KEY|DB_URL) printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV" ;;
            esac
            case "$name" in
              API_URL) printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$value" >> "$GITHUB_ENV" ;;
              PUBLISHABLE_KEY) printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$value" >> "$GITHUB_ENV" ;;
            esac
          done <<< "$status"
      - name: Install and build
        run: node scripts/ci.mjs run ci build
      - name: Install Chromium (own time limit, one retry)
        # PR C de la 002: `playwright install --with-deps` se colgó dos veces en el PR B y otra en el PR C (run 42138118052).
        # La salida a la vista (run 42153365570) mostró la causa: no es un cuelgue, es apt bajando las fuentes de
        # `install-deps` a ~40 KB/s desde el mirror del runner; las librerías de Chromium ya vienen en la imagen. Por eso:
        # descarga del navegador con 150 s y un reintento; si Chromium arranca con las librerías del runner, no se instala
        # nada con apt; si no arranca, `install-deps` con 150 s y un reintento, matando antes el apt-get que dejó el
        # intento anterior (el `timeout` mata npx, no a su apt-get con sudo, que retiene el bloqueo de dpkg). Sin caché de
        # binarios (docs/TESTING.md §9).
        timeout-minutes: 6
        shell: bash
        run: |
          started=$(date +%s%3N)
          try() { for attempt in 1 2; do timeout 150 "$@" && return 0; echo "::warning::$* (intento $attempt) falló o superó 150 s"; sudo pkill -x apt-get || true; done; return 1; }
          try npx playwright install --only-shell chromium
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close(), () => process.exit(1))"; then
            echo "Chromium arranca con las librerías del runner: sin install-deps"
          else
            try npx playwright install-deps chromium
          fi
          echo "{\"command\":\"chromium\",\"seconds\":$(( ($(date +%s%3N) - started) / 1000 )),\"status\":0}" >> "$RUNNER_TEMP/juntia-ci-$GITHUB_JOB.jsonl"
      - name: Install Arial and Georgia for the font fallbacks (T053)
        # Los respaldos de Onest y Brygada (globals.css) se ajustan sobre local("Arial") y local("Georgia"), presentes en
        # Windows, macOS e iOS y no en el runner. Sin ellas el arnés mediría otro respaldo, no el de la app.
        shell: bash
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install -y -qq ttf-mscorefonts-installer > /dev/null
          fc-list | grep -c -i -E "arial|georgia"
      - name: Screenshots, seven-width pass and theme harness
        env:
          # PR D: con un filtro, solo los estados nuevos del PR; el resto ya tiene su evidencia en su PR.
          EVIDENCE_FILTER: ${{ inputs.evidence_filter }}
        # 005: los arneses del job `release` (etiqueta @release) no corren aquí.
        run: npx playwright test --project evidence --grep-invert "@serial|@release" --workers 4 --retries 0 --reporter=line
      - name: Serial evidence (PR C states and CLS, PR D lab INP; alters the runner database)
        if: always()
        # --output propio: Playwright vacía su carpeta de salida al empezar y borraría las capturas del paso anterior.
        env:
          # Con filtro (corrida de evidencia del PR D), de lo serial solo el INP de laboratorio (T085).
          SERIAL_GREP: ${{ inputs.evidence_filter != '' && '@inp' || '@serial' }}
        run: npx playwright test --project evidence --grep "$SERIAL_GREP" --workers 1 --retries 0 --reporter=line --output test-results/serial
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence
          path: test-results/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: supabase stop

  release:
    # 005 (contracts/ci.md, «Job nuevo: release»; FR-020, FR-050–FR-054, FR-093). Laboratorio del release, SOLO a mano
    # («Run workflow» con release_lab, sola): nunca corre en un PR y no es del gate. Lo lanza el gestor en el punto de control
    # del PR A y sobre el commit candidato. Cada tramo es un job de la matriz con su Supabase, su build y su navegador; lo
    # que corre cada uno está en scripts/release-leg.mjs. Presupuesto: 600 s sin bloquear (scripts/ci.mjs, jobBudget); el
    # tope duro es timeout-minutes. Un tramo que mida más de 600 s se parte en dos (F85-7), nunca se le quitan cargas.
    needs: inputs-guard
    if: github.event_name == 'workflow_dispatch' && inputs.release_lab && !inputs.capture_evidence && !inputs.a11y_sweep && !inputs.measure_workers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # T046: los tramos de más de 600 s del punto de control (run 44349192421), partidos sin quitar cargas; Inicio en Yo y
        # Actividad, en tercios desde el parcial 44355668184.
        leg: [cls-inicio-yo-1, cls-inicio-yo-2, cls-inicio-yo-3, cls-inicio-nosotros, cls-actividad-1, cls-actividad-2, cls-actividad-3, cls-balance, cls-plan, cls-analisis, cls-metas,
              cls-controls-chromium, lab-interaction, webkit-e2e-1, webkit-e2e-2,
              webkit-cls-1, webkit-cls-2a, webkit-cls-2b, webkit-cls-3a, webkit-cls-3b,
              firefox-cls-1, firefox-cls-2a, firefox-cls-2b, firefox-cls-3a, firefox-cls-3b]
    env:
      SITE_URL: http://localhost:3400
    steps:
      - name: Start job clock
        run: echo "JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Leg requested by release_legs
        # Vacío = todos. Un tramo no pedido termina aquí, en segundos, con «no pedido» en el resumen; nunca como aprobado.
        id: leg
        env:
          RELEASE_LEGS: ${{ inputs.release_legs }}
        run: |
          node scripts/release-leg.mjs requested "${{ matrix.leg }}"
          node scripts/release-leg.mjs browser "${{ matrix.leg }}"
      - uses: supabase/setup-cli@v3
        if: steps.leg.outputs.run == 'true'
        with:
          version: 2.121.0
      - name: Start Supabase with Auth and Mailpit
        if: steps.leg.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1 || { echo "Supabase start failed (raw log withheld because it may contain credentials)"; exit 1; }
          seconds=$(($(date +%s)-started))
          echo "supabase start: ${seconds} s" | tee -a "$GITHUB_STEP_SUMMARY"
          # El comando imprime credenciales: capturar y enmascarar antes de cualquier salida.
          status=$(supabase status -o env 2>/dev/null)
          while IFS='=' read -r name value; do
            value=${value#\"}; value=${value%\"}
            [ -z "$value" ] || echo "::add-mask::$value"
            case "$name" in
              API_URL|PUBLISHABLE_KEY|SECRET_KEY|DB_URL) printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV" ;;
            esac
            case "$name" in
              API_URL) printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$value" >> "$GITHUB_ENV" ;;
              PUBLISHABLE_KEY) printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$value" >> "$GITHUB_ENV" ;;
            esac
          done <<< "$status"
      - name: Restore the Next build cache
        # La clave del job `e2e` (mismas variables públicas del Supabase del runner).
        if: steps.leg.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: next-${{ runner.os }}-e2e-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-e2e-${{ hashFiles('package-lock.json') }}-
      - name: Install and build with the runner's Supabase
        if: steps.leg.outputs.run == 'true'
        run: node scripts/ci.mjs run ci build
      - name: Install the leg's browser (own time limit, one retry)
        # El patrón de Chromium de los demás jobs (PR C de la 002): descarga con tope y un reintento; si el navegador no
        # arranca con las librerías del runner, install-deps con tope y un reintento, matando antes el apt-get colgado.
        # WebKit y Firefox suelen necesitar sus librerías por apt (60–180 s, contracts/ci.md): tope de 240 s por intento.
        if: steps.leg.outputs.run == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          BROWSER: ${{ steps.leg.outputs.browser }}
        run: |
          started=$(date +%s%3N)
          try() { for attempt in 1 2; do timeout 240 "$@" && return 0; echo "::warning::$* (intento $attempt) falló o superó 240 s"; sudo pkill -x apt-get || true; done; return 1; }
          if [ "$BROWSER" = "chromium" ]; then try npx playwright install --only-shell chromium; else try npx playwright install "$BROWSER"; fi
          if node -e "require('@playwright/test')[process.env.BROWSER].launch().then((b) => b.close(), () => process.exit(1))"; then
            echo "$BROWSER arranca con las librerías del runner: sin install-deps"
          else
            try npx playwright install-deps "$BROWSER"
          fi
          echo "{\"command\":\"$BROWSER\",\"seconds\":$(( ($(date +%s%3N) - started) / 1000 )),\"status\":0}" >> "$RUNNER_TEMP/juntia-ci-$GITHUB_JOB.jsonl"
      - name: Install Arial and Georgia for the font fallbacks
        # Como en `evidence`: los respaldos de Onest y Brygada se ajustan sobre Arial y Georgia; sin ellas, otra geometría.
        if: steps.leg.outputs.run == 'true'
        shell: bash
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install -y -qq ttf-mscorefonts-installer > /dev/null
          fc-list | grep -c -i -E "arial|georgia"
      - name: Run the leg
        if: steps.leg.outputs.run == 'true'
        run: node scripts/release-leg.mjs run "${{ matrix.leg }}"
      - uses: actions/upload-artifact@v6
        if: always() && steps.leg.outputs.run == 'true'
        with:
          name: release-${{ matrix.leg }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Supabase
        if: always() && steps.leg.outputs.run == 'true'
        run: supabase stop
      - name: Publish release timings
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ci.mjs summary
